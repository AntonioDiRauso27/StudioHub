name: Verifica StudioHub su Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compila i moduli e verifica i calcoli
        run: |
          node reportflow/build.cjs
          node riconcilia/build.cjs
          node reportflow/verify.cjs
          node --test reportflow/tests/charts.test.cjs
          node --test riconcilia/tests/core.test.cjs

      - name: Verifica salvataggio e ripresa
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python tests/persistence_server.py

      - name: Prepara il pacchetto Windows
        run: python scripts/build_windows.py

      - name: Verifica il runtime incluso
        run: |
          python tests/smoke_server.py --package "release/windows/StudioHub Windows"
          python tests/persistence_server.py --package "release/windows/StudioHub Windows"

      - name: Prepara il test nel browser
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install chromium

      - name: Verifica moduli e download
        run: python tests/browser_windows.py --package "release/windows/StudioHub Windows"

      - name: Conserva il pacchetto verificato
        uses: actions/upload-artifact@v7
        with:
          name: StudioHub-Windows-x64-verificato
          path: release/windows/StudioHub_WINDOWS_x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Conserva schermata di verifica
        uses: actions/upload-artifact@v7
        with:
          name: StudioHub-prova-Windows
          path: test-results/
          retention-days: 14
